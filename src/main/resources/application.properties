# ── Aplicación ──────────────────────────────────────────
spring.application.name=tfi-monolito
server.port=8080

# ── Base de datos MySQL ──────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/tfi_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ──────────────────────────────────────────────────
jwt.secret=clave-super-secreta-tfi-2024-debe-tener-256-bits-minimo
jwt.expiration=86400000
